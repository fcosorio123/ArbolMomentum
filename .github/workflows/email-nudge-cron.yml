# Scheduled email nudges — runs every 15 minutes on GitHub Actions.
# Requires repository secret: CRON_SECRET (same value as Supabase edge function secret).

name: Email nudge cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-nudges:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-daily-email-nudges
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET not set in repository secrets — scheduled email nudges cannot run."
            exit 1
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://lhbvzojmtvjeauqnnmdu.supabase.co/functions/v1/make-server-5d90ddf5/run-daily-email-nudges"
